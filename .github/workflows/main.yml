name: fffffffff
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the mod
        run: bash gradlew build --no-daemon
      - name: Save the finished mod
        uses: actions/upload-artifact@v4
        with:
          name: mentalout-mod
          path: build/libs/*.jar
