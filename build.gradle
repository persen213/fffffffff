// Toaru Esper Add-on for Re:AcademyCraft 1.5.0 (Minecraft 1.20.1, Forge 47.4.10).
// Built the same way as the official Re:AcademyCraft example add-on.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'io.toaruesper.addon'
version = '0.1.0'
base { archivesName = 'toaru-esper-addon-forge-1.20.1' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            mods { toaruesper { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { toaruesper { source sourceSets.main } }
        }
    }
}

repositories {
    // The Re:AcademyCraft public API jar (compile-time only). It sits in the libs folder of this project.
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    // API only: the add-on is compiled against the public API and needs the real Re:AcademyCraft mod at run time.
    // The API classes are NOT packed into our jar.
    implementation fg.deobf('blank:re-academycraft-forge-1.20.1:1.5.0:api')
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}

tasks.named('jar', Jar) {
    manifest {
        attributes 'Implementation-Title': 'Toaru Esper Add-on',
                   'Implementation-Version': project.version
    }
    finalizedBy 'reobfJar'
}
